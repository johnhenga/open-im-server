sonar.projectKey=openim-server
sonar.projectName=OpenIM-Server
sonar.projectVersion=1.0

# Path to source files
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/bin/**,assets/**,deployments/**,scripts/**

# Path to test files
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go specific configurations
sonar.go.coverage.reportPaths=coverage.out
sonar.go.golint.reportPaths=golint.report
sonar.go.tests.reportPaths=test.report
