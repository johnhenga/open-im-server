# dev clone of openim namespace into scp-cpall-7app-dev
config:
  kubernetes:
    namespace: scp-cpall-7app-dev
  mongo:
    # single-member replicaset rs0 (dev) -> one seed host
    uri: mongodb://openIM:openIM123@im-mongodb-0.im-mongodb-headless:27017/openim_v3?replicaSet=rs0&maxPoolSize=300
# cluster-internal: no ingress
ingress:
  enabled: false
# all 12 components run the same custom combined image (matches source runtime, not stale ghcr values)
image: &img
  repository: 971022779850.dkr.ecr.ap-southeast-1.amazonaws.com/sds-scp-tmp
  tag: openim-server-push-fix
  pullPolicy: Always
openim-msggateway:
  image: *img
openim-msggateway-proxy:
  image: *img
  ingress:
    enabled: false
openim-msgtransfer:
  image: *img
openim-push:
  image: *img
openim-rpc-auth:
  image: *img
openim-rpc-conversation:
  image: *img
openim-rpc-friend:
  image: *img
openim-rpc-group:
  image: *img
openim-rpc-msg:
  image: *img
openim-rpc-third:
  image: *img
openim-rpc-user:
  image: *img
