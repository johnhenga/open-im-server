# dev: single controller, replication factor 1 everywhere
controller:
  replicaCount: 1
defaultReplicationFactor: 1
minInsyncReplicas: 1
offsetsTopicReplicationFactor: 1
transactionStateLogReplicationFactor: 1
transactionStateLogMinIsr: 1
metrics:
  jmx:
    enabled: false
provisioning:
  enabled: true
  numPartitions: 8
  replicationFactor: 1
  topics:
  - name: toRedis
    partitions: 8
    replicationFactor: 1
    config:
      max.message.bytes: 64000
  - name: toMongo
    partitions: 8
    replicationFactor: 1
    config:
      max.message.bytes: 64000
  - name: toPush
    partitions: 8
    replicationFactor: 1
    config:
      max.message.bytes: 64000
  - name: toOfflinePush
    partitions: 8
    replicationFactor: 1
    config:
      max.message.bytes: 64000
# bitnami purged public.ecr.aws/bitnami; use official legacy relocation
global:
  imageRegistry: docker.io
  imagePullSecrets:
    - docker-hub
image:
  repository: bitnamilegacy/kafka
