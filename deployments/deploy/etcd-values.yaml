# etcd Cluster Configuration Values
# This file contains configurable parameters for the etcd StatefulSet

# Cluster Configuration
cluster:
  name: etcd-ha-cluster
  replicas: 3 # Number of etcd nodes (must be odd for quorum: 1, 3, 5, 7...)
  namespace: openim

# Image Configuration
image:
  repository: public.ecr.aws/eks-distro/etcd-io/etcd
  tag: v3.5.13-eks-1-29-1
  pullPolicy: IfNotPresent

# Storage Configuration
storage:
  className: standard # Storage class for persistent volumes
  size: 10Gi # Storage size per node

# Resource Configuration
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Performance Tuning
performance:
  heartbeatInterval: 100 # Milliseconds between heartbeats
  electionTimeout: 1000 # Milliseconds for leader election timeout
  maxSnapshots: 5 # Number of snapshots to keep
  maxWals: 5 # Number of WAL files to keep
  quotaBackendBytes: 8589934592 # 8GB backend quota

# Network Configuration
network:
  peerPort: 2380
  clientPort: 2379
  publishNotReadyAddresses: true # Allow peer discovery before ready

# Security Configuration
security:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  capabilities:
    drop:
      - ALL

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 2 # Minimum available pods during disruption

# Affinity Configuration
affinity:
  enabled: true
  podAntiAffinity: preferred # 'preferred' or 'required'
  # 'required' will prevent scheduling if anti-affinity can't be satisfied
  # 'preferred' will try to spread pods but allow same node if necessary

# Health Probes Configuration
healthProbes:
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 1
  startup:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 12 # 60 seconds max startup time

# NetworkPolicy Configuration
networkPolicy:
  enabled: true
  # Allows traffic from pods in openim namespace
  allowNamespace: openim

# Monitoring Configuration
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false # Set to true if Prometheus operator is installed
    interval: 30s
    scrapeTimeout: 10s

# Logging Configuration
logging:
  level: info # other options: debug, warn, error
  format: zap # etcd logs format

# Service Configuration
service:
  headless:
    name: etcd-headless
    clusterIP: None
    publishNotReadyAddresses: true
  client:
    name: etcd-client
    type: ClusterIP
    port: 2379

# Timezone
timezone: UTC
